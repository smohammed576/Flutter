name: gym
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  uuid: ^4.5.1
  flutter_svg: ^2.2.0
  intl: ^0.20.2
  fl_chart: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.5.4

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/Icons/
  fonts:
    - family: Arial
      fonts:
        - asset: fonts/Arial.ttf
        - asset: fonts/Arial Italic.ttf
          style: italic
        - asset: fonts/Arial Bold.ttf
          weight: 700
        - asset: fonts/Arial Bold Italic.ttf
          style: italic
          weight: 700
        - asset: fonts/Arial Black.ttf
          weight: 900
        - asset: fonts/Arial Black Italic.ttf
          style: italic
          weight: 900