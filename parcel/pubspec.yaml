name: parcel
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  http: ^1.5.0
  path_provider: ^2.1.5
  path: ^1.9.1
  sqflite: ^2.4.2
  intl: ^0.20.2
  uuid: ^4.5.1
  shared_preferences: ^2.5.3
  video_player: ^2.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/data/
    - assets/people/
  fonts:
    - family: Geist
      fonts:
        - asset: fonts/Geist-Regular.ttf
          weight: 400
        - asset: fonts/Geist-Thin.ttf
          weight: 100
        - asset: fonts/Geist-ExtraLight.ttf
          weight: 200
        - asset: fonts/Geist-Light.ttf
          weight: 300
        - asset: fonts/Geist-Medium.ttf
          weight: 500
        - asset: fonts/Geist-SemiBold.ttf
          weight: 600
        - asset: fonts/Geist-Bold.ttf
          weight: 700
        - asset: fonts/Geist-ExtraBold.ttf
          weight: 800
        - asset: fonts/Geist-Black.ttf
          weight: 900
    - family: Nunito
      fonts:
        - asset: fonts/Nunito-Regular.ttf
          weight: 400
        - asset: fonts/Nunito-Light.ttf
          weight: 300
        - asset: fonts/Nunito-Medium.ttf
          weight: 500
        - asset: fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: fonts/Nunito-Bold.ttf
          weight: 700
        - asset: fonts/Nunito-ExtraBold.ttf
          weight: 800
        - asset: fonts/Nunito-Black.ttf
          weight: 900
