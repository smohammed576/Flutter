name: smoothie
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_svg: ^2.2.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.5.4

flutter:
  uses-material-design: true
  assets:
    - assets/
  fonts:
    - family: Kanit
      fonts:
        - asset: fonts/Kanit-Regular.ttf
          weight: 400
        - asset: fonts/Kanit-Light.ttf
          weight: 200
        - asset: fonts/Kanit-Medium.ttf
          weight: 500
        - asset: fonts/Kanit-SemiBold.ttf
          weight: 600
        - asset: fonts/Kanit-Bold.ttf
          weight: 700
        - asset: fonts/Kanit-ExtraBold.ttf
          weight: 800
        - asset: fonts/Kanit-Black.ttf
          weight: 900
